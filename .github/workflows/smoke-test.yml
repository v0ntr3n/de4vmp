name: Smoke Test (Windows x64)

on:
  workflow_dispatch:
    inputs:
      timeout_seconds:
        description: "Per-invocation CLI timeout in seconds"
        required: false
        default: "30"
        type: string
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages

jobs:
  smoke-test-win-x64:
    name: Headless CLI Smoke Tests (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 7 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "7.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore and build solution (Release)
        shell: pwsh
        run: |
          dotnet restore de4vmp.sln
          dotnet restore de4vmp/de4vmp.csproj -r win-x64
          dotnet build de4vmp.sln -c Release --no-restore

      - name: Publish self-contained Windows x64 executable
        shell: pwsh
        run: |
          dotnet publish de4vmp/de4vmp.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/win-x64

      - name: Run headless CLI smoke tests
        shell: pwsh
        run: |
          $timeout = "${{ inputs.timeout_seconds }}"
          if ([string]::IsNullOrWhiteSpace($timeout)) { $timeout = "30" }
          pwsh -NoProfile -ExecutionPolicy Bypass -File scripts/smoke-test.ps1 `
            -ExecutablePath "publish/win-x64/de4vmp.exe" `
            -ArtifactsDir "smoke-artifacts" `
            -TimeoutSeconds ([int]$timeout)

      - name: Publish smoke test summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path "smoke-artifacts/smoke-summary.md") {
            Get-Content "smoke-artifacts/smoke-summary.md" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: de4vmp-smoke-test-diagnostics
          path: |
            smoke-artifacts/logs/
            smoke-artifacts/smoke-results.json
            smoke-artifacts/smoke-summary.md
          if-no-files-found: warn
          retention-days: 30
