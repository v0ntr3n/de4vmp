name: Build (Windows x64)

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages

jobs:
  build-win-x64:
    name: Build & Publish Windows x64 (.NET 7)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 7 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "7.0.x"

      - name: Verify .NET environment
        shell: pwsh
        run: dotnet --info

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/global.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore solution and win-x64 dependencies
        shell: pwsh
        run: |
          dotnet restore de4vmp.sln
          dotnet restore de4vmp/de4vmp.csproj -r win-x64

      - name: Build solution (Release)
        shell: pwsh
        run: dotnet build de4vmp.sln -c Release --no-restore

      - name: Publish self-contained Windows x64 executable
        shell: pwsh
        run: |
          dotnet publish de4vmp/de4vmp.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/win-x64

      - name: Verify published binary and generate checksums
        shell: pwsh
        run: |
          $exe = Join-Path "publish/win-x64" "de4vmp.exe"
          if (-not (Test-Path $exe)) {
            throw "Published executable not found at $exe"
          }
          & $exe --version
          Get-ChildItem -Path "publish/win-x64" -File |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLowerInvariant())  $(Split-Path -Leaf $_.Path)" } |
            Set-Content -Path "publish/win-x64/SHA256SUMS.txt" -Encoding utf8
          Get-Content "publish/win-x64/SHA256SUMS.txt"

      - name: Upload Windows x64 binaries
        uses: actions/upload-artifact@v4
        with:
          name: de4vmp-win-x64
          path: publish/win-x64/
          if-no-files-found: error
          retention-days: 30
