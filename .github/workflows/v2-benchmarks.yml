name: V2 Synthetic Benchmarks (.NET 8)

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  v2-benchmarks:
    name: Build & Verify V2 Synthetic Tiers 1-4
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore & build solution (Release)
        shell: pwsh
        run: |
          dotnet restore de4vmp.sln
          dotnet build de4vmp.sln -c Release --no-restore

      - name: Install dotnet-ilverify
        shell: pwsh
        run: |
          dotnet tool install -g dotnet-ilverify --version 8.0.0
          "$HOME/.dotnet/tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Run V2 synthetic benchmark, adversarial & ILVerify tests
        shell: pwsh
        env:
          DE4VMP_REQUIRE_ILVERIFY: "1"
        run: dotnet test tests/de4vmp.V2.Tests/de4vmp.V2.Tests.csproj -c Release --no-build --verbosity normal
