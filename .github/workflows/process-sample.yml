name: Process repository sample (Windows x64)

on:
  workflow_dispatch:
    inputs:
      publish_public_results:
        description: 'Publish output and logs as public artifacts (only if authorized to share)'
        type: boolean
        default: false
      require_devirtualized_output:
        description: 'Fail the workflow if de4vmp reports an unsupported target (exit code 3)'
        type: boolean
        default: false
  push:
    branches: [master]
    paths:
      - '.github/workflows/process-sample.yml'
      - 'samples/cleaned-demutate2-cleaned.zip'

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  process-sample:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build tool
        shell: pwsh
        run: |
          dotnet publish de4vmp/de4vmp.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o publish/win-x64
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed.' }
          & ./publish/win-x64/de4vmp.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'CLI startup failed.' }

      - name: Extract expected sample as data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:GITHUB_WORKSPACE 'samples/cleaned-demutate2-cleaned.zip'
          $dir = Join-Path $env:RUNNER_TEMP 'sample-input'
          New-Item -ItemType Directory -Path $dir -Force | Out-Null
          $destination = Join-Path $dir 'cleaned-demutate2-cleaned.exe'
          $archive = [System.IO.Compression.ZipFile]::OpenRead($source)
          try {
            $entries = @($archive.Entries | Where-Object { $_.Name -ieq 'cleaned-demutate2-cleaned.exe' })
            if ($entries.Count -ne 1) { throw 'Expected exactly one cleaned-demutate2-cleaned.exe in the archive.' }
            if ($entries[0].Length -le 0 -or $entries[0].Length -gt 536870912) { throw 'Invalid sample size.' }
            [System.IO.Compression.ZipFileExtensions]::ExtractToFile($entries[0], $destination, $false)
          } finally { $archive.Dispose() }
          Write-Host 'Expected sample extracted to a fixed runner temporary path.'

      - name: Process sample without executing the input
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $inputPath = Join-Path $env:RUNNER_TEMP 'sample-input/cleaned-demutate2-cleaned.exe'
          $outDir = Join-Path $env:RUNNER_TEMP 'sample-results'
          New-Item -ItemType Directory -Path $outDir -Force | Out-Null
          $outputPath = Join-Path $outDir 'cleaned-demutate2-cleaned_devirtualized.exe'
          $tool = (Resolve-Path 'publish/win-x64/de4vmp.exe').Path
          $arguments = @('--ci','--no-banner','--timeout','1800','--input',('"' + $inputPath + '"'),'--output',('"' + $outputPath + '"'))
          $p = Start-Process -FilePath $tool -ArgumentList $arguments -RedirectStandardOutput (Join-Path $outDir 'stdout.log') -RedirectStandardError (Join-Path $outDir 'stderr.log') -NoNewWindow -PassThru
          if (-not $p.WaitForExit(1860000)) {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            $p.WaitForExit()
            $code = 124
          } else { $code = $p.ExitCode }
          $validOutput = (Test-Path -LiteralPath $outputPath -PathType Leaf) -and ((Get-Item -LiteralPath $outputPath).Length -gt 0)
          if ($code -eq 0 -and -not $validOutput) { $code = 1 }
          if ($code -ne 0) { Remove-Item -LiteralPath $outputPath -ErrorAction SilentlyContinue }
          $strictOutput = ('${{ github.event_name }}' -eq 'workflow_dispatch') -and ('${{ inputs.require_devirtualized_output }}' -eq 'true')
          $status = switch ($code) {
            0 { 'devirtualized' }
            3 { 'unsupported_target' }
            124 { 'timeout' }
            default { 'error' }
          }
          $report = @{
            status = $status
            exit_code = $code
            input_sha256 = (Get-FileHash -LiteralPath $inputPath -Algorithm SHA256).Hash
            output_created = ($code -eq 0)
            output_sha256 = $(if ($code -eq 0) { (Get-FileHash -LiteralPath $outputPath -Algorithm SHA256).Hash } else { $null })
          }
          $report | ConvertTo-Json | Set-Content (Join-Path $outDir 'status.json')
          Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Value @(
            "## Sample processing",
            "Status: $status",
            "Exit code: $code",
            "Output created: $($report.output_created)",
            "Note: de4vmp targets VMProtect .NET 3.4/3.5; exit code 3 indicates an unsupported target.",
            "Public results require explicit manual opt-in."
          )
          if ($code -eq 3 -and -not $strictOutput) {
            Write-Warning 'de4vmp exited with code 3 (unsupported VMProtect target; de4vmp supports VMProtect .NET 3.4/3.5).'
          } elseif ($code -ne 0) {
            throw "Tool exited with code $code."
          }

      - name: Upload status
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: sample-status
          path: ${{ runner.temp }}/sample-results/status.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Upload explicitly authorized public results
        if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.publish_public_results }}
        uses: actions/upload-artifact@v4
        with:
          name: sample-public-results
          path: ${{ runner.temp }}/sample-results/
          if-no-files-found: warn
          retention-days: 3
